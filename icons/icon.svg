<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Math foundations for machine learning">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bb5420"/>
      <stop offset="1" stop-color="#782b0d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g id="art" fill="none" stroke-linecap="round">
    <!-- axes -->
    <path d="M104 100 V394 H412" stroke="#fbf9f5" stroke-opacity=".34" stroke-width="13"/>
    <!-- loss curve -->
    <path d="M120 140 C188 150 206 300 256 318 C306 336 350 260 398 182" stroke="#fbf9f5" stroke-width="21"/>
    <!-- tangent: zero slope at the minimum -->
    <path d="M196 336 H316" stroke="#f0a86f" stroke-width="13"/>
    <!-- descent steps -->
    <g fill="#f0a86f" stroke="#8c3411" stroke-width="7">
      <circle cx="141" cy="162" r="16"/>
      <circle cx="194" cy="228" r="19"/>
    </g>
    <circle cx="256" cy="318" r="25" fill="#fbf9f5" stroke="#8c3411" stroke-width="8"/>
  </g>
</svg>
